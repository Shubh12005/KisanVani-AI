version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kisanvani-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kisanvani_db
    volumes:
      - mongo_data:/data/db
    networks:
      - kisanvani-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisanvani-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=kisanvani_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
    networks:
      - kisanvani-network

volumes:
  mongo_data:
    driver: local

networks:
  kisanvani-network:
    driver: bridge
